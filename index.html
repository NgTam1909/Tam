<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang đăng nhập</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Đăng nhập</h1>
            <p>Đăng nhập để tiếp tục</p>
        </div>
        
        <div class="success-message" id="successMessage">
            <i class="fas fa-check-circle"></i> Đăng nhập thành công! Đang chuyển hướng...
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">Username/Email</label>
                <div class="input-with-icon">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" class="form-control" placeholder="Username/Email">
                </div>
                <div class="error" id="usernameError">Hãy nhập tên người dùng hoặc email hợp lệ</div>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" class="form-control" placeholder="Password">
                    <button type="button" class="password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <div class="error" id="passwordError">Mật khẩu phải có ít nhất 8 ký tự</div>
            </div>
            
            <div class="remember-forgot">
                <div class="remember-log">
                    <input type="checkbox" id="remember-log">
                    <label for="remember-log">Ghi nhớ đăng nhập</label>
                </div>
                <a href="#" class="forgot-password">Quên mật khẩu?</a>
            </div>
            
            <button type="submit" class="submit-btn" id="loginBtn">
                <span id="btnText">Đăng nhập</span>
                <i class="fas fa-spinner fa-spin" id="btnSpinner" style="display: none;"></i>
            </button>
            
            <div class="signup-link">
                Bạn chưa có tài khoản? <a href="#">Đăng ký ngay</a>
            </div>
        </form>
        
        <div class="login-footer">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
